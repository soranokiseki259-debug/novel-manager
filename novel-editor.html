<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>小説エディタ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --bg2: #16213e;
      --bg3: #0f3460;
      --accent: #e94560;
      --accent2: #a855f7;
      --text: #e2e8f0;
      --text2: #94a3b8;
      --border: #2d3748;
      --card: #1e2a3a;
      --card2: #253347;
      --success: #10b981;
      --warning: #f59e0b;
      --sidebar-w: 280px;
    }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      border-bottom: 2px solid var(--accent);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }
    .header-project-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      padding: 4px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-project-name:hover { border-color: var(--accent2); }
    .header-spacer { flex: 1; }
    .header-btn {
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .header-btn:hover { background: var(--bg3); border-color: var(--accent2); }
    .header-btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .header-btn.accent:hover { opacity: 0.85; }
    .save-indicator {
      font-size: 0.75rem;
      color: var(--success);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .save-indicator.show { opacity: 1; }

    /* ===== MOBILE HAMBURGER ===== */
    .hamburger {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1.2rem;
      padding: 4px 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 199;
    }
    .sidebar-overlay.open { display: block; }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      header { padding: 8px 12px; gap: 8px; }
      .header-title { font-size: 0.9rem; }
      .header-project-name { max-width: 100px; font-size: 0.8rem; padding: 3px 8px; }
      .header-btn { padding: 4px 8px; font-size: 0.72rem; }
      .save-indicator { display: none; }
      #sync-ui #sync-username { display: none; }
      #sync-ui #sync-logout-btn { display: none; }
      #sync-ui #sync-status { display: none; }

      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        height: 100%;
        z-index: 200;
        transition: left 0.25s ease;
        box-shadow: none;
      }
      .sidebar.open {
        left: 0;
        box-shadow: 4px 0 20px rgba(0,0,0,0.4);
      }
      .editor-area { width: 100% !important; }
      .editor-toolbar { flex-wrap: wrap; gap: 4px; }
      .toolbar-btn { font-size: 0.75rem; padding: 4px 8px; }
      .editor-ep-title { font-size: 0.8rem; }
    }
    @media (max-width: 480px) {
      .header-title { display: none; }
      .header-project-name { max-width: 80px; }
      .header-btn.hide-mobile { display: none; }
    }

    /* ===== MAIN LAYOUT ===== */
    .main-wrap {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex: 1;
    }
    .sidebar-add-btn {
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
    }
    .sidebar-add-btn:hover { background: var(--accent); color: #fff; }
    .sidebar-tree {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .sidebar-tree::-webkit-scrollbar { width: 6px; }
    .sidebar-tree::-webkit-scrollbar-track { background: transparent; }
    .sidebar-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Chapter */
    .chapter-item {
      margin: 2px 6px;
    }
    .chapter-header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }
    .chapter-header:hover { background: var(--card); }
    .chapter-toggle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text2);
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .chapter-toggle.open { transform: rotate(90deg); }
    .chapter-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chapter-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .chapter-header:hover .chapter-actions { opacity: 1; }
    .ch-action-btn {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }
    .ch-action-btn:hover { background: var(--bg3); color: var(--text); }
    .ch-action-btn.del:hover { color: var(--accent); }

    /* Episode */
    .episode-list {
      padding-left: 20px;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }
    .episode-list.collapsed { max-height: 0 !important; }
    .episode-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      margin: 1px 0;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }
    .episode-item:hover { background: var(--card); }
    .episode-item.active { background: var(--bg3); border-left: 3px solid var(--accent); }
    .episode-icon {
      font-size: 0.7rem;
      color: var(--text2);
      flex-shrink: 0;
    }
    .episode-label {
      font-size: 0.82rem;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .episode-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .episode-item:hover .episode-actions { opacity: 1; }
    .ep-action-btn {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }
    .ep-action-btn:hover { background: var(--bg3); color: var(--text); }
    .ep-action-btn.del:hover { color: var(--accent); }

    /* ===== EDITOR AREA ===== */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-toolbar {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg2);
      flex-shrink: 0;
    }
    .editor-ep-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }
    .toolbar-btn {
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .toolbar-btn:hover { background: var(--bg3); border-color: var(--accent2); }
    .toolbar-btn.cleanup { color: var(--warning); border-color: var(--warning); }
    .toolbar-btn.cleanup:hover { background: var(--warning); color: #000; }
    .toolbar-btn.novel-fmt { color: var(--accent2); border-color: var(--accent2); }
    .toolbar-btn.novel-fmt:hover { background: var(--accent2); color: #fff; }

    .editor-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .editor-textarea {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: none;
      padding: 24px 32px;
      font-size: 1rem;
      line-height: 2;
      font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'MS Mincho', serif;
      resize: none;
      outline: none;
      overflow-y: auto;
    }
    .editor-textarea::placeholder {
      color: var(--text2);
      opacity: 0.5;
    }
    .editor-textarea::-webkit-scrollbar { width: 8px; }
    .editor-textarea::-webkit-scrollbar-track { background: var(--bg); }
    .editor-textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .editor-textarea::-webkit-scrollbar-thumb:hover { background: var(--text2); }

    /* Writing mode toggle */
    .editor-textarea.vertical {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 32px 24px;
    }

    /* ===== STATUS BAR ===== */
    .status-bar {
      padding: 5px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text2);
      flex-shrink: 0;
    }
    .status-item { white-space: nowrap; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text2);
    }
    .empty-state-icon { font-size: 3rem; opacity: 0.3; }
    .empty-state-text { font-size: 0.9rem; }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
    }
    .modal-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      outline: none;
    }
    .modal-input:focus { border-color: var(--accent2); }
    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .modal-btn {
      padding: 8px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-btn:hover { background: var(--bg3); }
    .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-btn.primary:hover { opacity: 0.85; }

    /* ===== CONTEXT MENU ===== */
    .ctx-menu {
      display: none;
      position: fixed;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      min-width: 160px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 2000;
    }
    .ctx-menu.open { display: block; }
    .ctx-menu-item {
      padding: 7px 14px;
      font-size: 0.82rem;
      color: var(--text);
      cursor: pointer;
      border-radius: 5px;
      transition: background 0.1s;
    }
    .ctx-menu-item:hover { background: var(--bg3); }
    .ctx-menu-item.danger { color: var(--accent); }
    .ctx-menu-item.danger:hover { background: rgba(233,69,96,0.15); }
    .ctx-menu-sep { height: 1px; background: var(--border); margin: 4px 8px; }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 40px;
      right: 20px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fff;
      background: var(--bg3);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(10px);
      animation: toastIn 0.3s forwards;
    }
    .toast.success { border-color: var(--success); }
    .toast.warn { border-color: var(--warning); }
    .toast.error { border-color: var(--accent); }
    @keyframes toastIn {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== TTS READING VIEW (読み上げ追従ビュー) ===== */
    .tts-view {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 5000;
      flex-direction: column;
    }
    .tts-view.open { display: flex; }
    .tts-view-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      border-bottom: 2px solid var(--accent);
      flex-shrink: 0;
    }
    .tts-view-title {
      flex: 1;
      font-weight: 700;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tts-view-close {
      padding: 6px 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .tts-view-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 45vh;
      font-size: 1.02rem;
      line-height: 2;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      -webkit-overflow-scrolling: touch;
    }
    .tts-view-body p { margin: 0 0 1em; }
    .tts-sentence {
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.25s;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .tts-sentence.current {
      background: rgba(233,69,96,0.32);
      color: #fff;
    }
    .tts-view-footer {
      flex-shrink: 0;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    .tts-progress {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text2);
      margin-bottom: 8px;
    }
    .tts-footer-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    .tts-ctrl-btn {
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .tts-ctrl-btn.main {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      padding: 10px 26px;
      font-size: 1.05rem;
      min-width: 84px;
    }
    .tts-speed-select {
      padding: 9px 6px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.85rem;
    }

    /* Cleanup preview */
    .cleanup-preview {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.6;
    }
    .cleanup-stat { color: var(--warning); font-weight: 600; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <button class="hamburger" onclick="toggleMobileSidebar()" aria-label="メニュー">&#9776;</button>
    <a href="index.html" style="color:var(--accent);font-size:1.2rem;text-decoration:none;margin-right:4px" title="ホームへ戻る">&#8962;</a>
    <div class="header-title">Novel Editor</div>
    <div class="header-project-name" id="projectName" onclick="renameProject()" title="クリックして名前を変更">無題のプロジェクト</div>
    <div class="header-spacer"></div>
    <span class="save-indicator" id="saveIndicator">保存済み</span>
    <button class="header-btn hide-mobile" onclick="importProject()">インポート</button>
    <button class="header-btn hide-mobile" onclick="exportProject()">エクスポート</button>
    <button class="header-btn" id="writingModeBtn" onclick="toggleWritingMode()">縦書き</button>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>

  <!-- MAIN -->
  <div class="main-wrap">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-header-label">構成</span>
        <button class="sidebar-add-btn" onclick="addChapter()">+ 章を追加</button>
      </div>
      <div class="sidebar-tree" id="sidebarTree"></div>
    </div>

    <!-- EDITOR -->
    <div class="editor-area" id="editorArea">
      <div class="editor-toolbar" id="editorToolbar" style="display:none;">
        <div class="editor-ep-title" id="editorEpTitle"></div>
        <button class="toolbar-btn" onclick="copyEpisodeText()">コピー</button>
        <button class="toolbar-btn cleanup" onclick="cleanupText()">空白整形</button>
        <button class="toolbar-btn novel-fmt" onclick="novelFormat()">小説整形</button>
        <button class="toolbar-btn" onclick="showStats()">文字数</button>
        <button class="toolbar-btn" id="ttsBtn" onclick="toggleTTS()">&#128266; 読み上げ</button>
      </div>
      <div class="editor-container" id="editorContainer">
        <div class="empty-state" id="emptyState">
          <div class="empty-state-icon">&#9997;</div>
          <div class="empty-state-text">左のサイドバーから章と話を追加して、執筆を始めましょう</div>
        </div>
        <textarea class="editor-textarea" id="editorTextarea" style="display:none;"
          placeholder="ここに本文を書く..."></textarea>
      </div>
      <div class="status-bar" id="statusBar" style="display:none;">
        <span class="status-item" id="statusChars">0 文字</span>
        <span class="status-item" id="statusLines">0 行</span>
        <span class="status-item" id="statusChapter"></span>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-title" id="modalTitle"></div>
      <div id="modalBody"></div>
      <div class="modal-btns" id="modalBtns"></div>
    </div>
  </div>

  <!-- CONTEXT MENU -->
  <div class="ctx-menu" id="ctxMenu"></div>

  <!-- TOAST -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- TTS READING VIEW (読み上げ追従ビュー) -->
  <div class="tts-view" id="ttsView">
    <div class="tts-view-header">
      <div class="tts-view-title" id="ttsViewTitle">読み上げ</div>
      <button class="tts-view-close" onclick="stopTTS()">&#10005; 終了</button>
    </div>
    <div class="tts-view-body" id="ttsViewBody"></div>
    <div class="tts-view-footer">
      <div class="tts-progress" id="ttsProgress"></div>
      <div class="tts-footer-controls">
        <button class="tts-ctrl-btn" onclick="ttsPrevSentence()" title="前の文">&#9198;</button>
        <button class="tts-ctrl-btn main" id="ttsViewPauseBtn" onclick="pauseResumeTTS()">&#10074;&#10074;</button>
        <button class="tts-ctrl-btn" onclick="ttsNextSentence()" title="次の文">&#9197;</button>
        <select class="tts-speed-select" id="ttsViewSpeed" onchange="ttsChangeSpeed(this.value)">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1">1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="1.75">1.75x</option>
          <option value="2">2x</option>
          <option value="2.5">2.5x</option>
          <option value="3">3x</option>
          <option value="3.5">3.5x</option>
          <option value="4">4x</option>
        </select>
      </div>
    </div>
  </div>

  <!-- HIDDEN FILE INPUT -->
  <input type="file" id="fileInput" accept=".json" style="display:none;">

<script>
/* ================================================================
   STATE
================================================================ */
let state = {
  projectTitle: '無題のプロジェクト',
  chapters: [],
  activeEpisodeId: null,
  writingMode: 'horizontal'
};

let autoSaveTimer = null;

/* ================================================================
   UTILS
================================================================ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
}

function showSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

/* ================================================================
   MODAL
================================================================ */
function openModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const btnsEl = document.getElementById('modalBtns');
  btnsEl.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'modal-btn' + (b.primary ? ' primary' : '');
    btn.textContent = b.label;
    btn.onclick = () => { closeModal(); if (b.action) b.action(); };
    btnsEl.appendChild(btn);
  });
  const _overlay = document.getElementById('modalOverlay');
  _overlay.style.display = 'flex';
  _overlay.classList.add('open');
  const inp = document.querySelector('#modalBody .modal-input');
  if (inp) setTimeout(() => inp.focus(), 50);
}

function closeModal() {
  const ov = document.getElementById('modalOverlay');
  ov.classList.remove('open');
  ov.style.display = 'none';
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

/* ================================================================
   CONTEXT MENU
================================================================ */
function showCtxMenu(e, items) {
  e.preventDefault();
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = '';
  items.forEach(item => {
    if (item === 'sep') {
      const sep = document.createElement('div');
      sep.className = 'ctx-menu-sep';
      menu.appendChild(sep);
    } else {
      const el = document.createElement('div');
      el.className = 'ctx-menu-item' + (item.danger ? ' danger' : '');
      el.textContent = item.label;
      el.onclick = () => { closeCtxMenu(); item.action(); };
      menu.appendChild(el);
    }
  });
  menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - items.length * 35) + 'px';
  menu.classList.add('open');
}

function closeCtxMenu() {
  document.getElementById('ctxMenu').classList.remove('open');
}

document.addEventListener('click', closeCtxMenu);

/* ================================================================
   DATA / PERSISTENCE
   複数プロジェクト対応:
   - ne_projects: [{id, title}] のプロジェクト一覧
   - ne_proj_<id>: 各プロジェクトの本体
   - ne_active: 現在開いているプロジェクトID
================================================================ */
const NE_LIST_KEY = 'ne_projects';
let _projectId = null;

// 旧形式 (novel_editor_data 1枠) → 新形式への自動移行 (index.html と同じ処理)
function migrateEditorStorage() {
  if (localStorage.getItem(NE_LIST_KEY)) return;
  const raw = localStorage.getItem('novel_editor_data');
  if (raw) {
    try {
      const data = JSON.parse(raw);
      // クラウド同期の旧ドキュメントIDと揃えるため 'main' を維持
      localStorage.setItem('ne_proj_main', raw);
      localStorage.setItem(NE_LIST_KEY, JSON.stringify([{ id: 'main', title: data.projectTitle || '無題のプロジェクト' }]));
      localStorage.setItem('ne_active', 'main');
      localStorage.removeItem('novel_editor_data');
    } catch (e) { console.warn('Editor data migration failed:', e); }
  } else {
    localStorage.setItem(NE_LIST_KEY, '[]');
  }
}

function saveState() {
  // Save current textarea content first
  syncCurrentEpisode();
  if (!_projectId) return;
  try {
    localStorage.setItem('ne_proj_' + _projectId, JSON.stringify(state));
    // プロジェクト一覧のタイトルを追随（名前変更時）
    try {
      const list = JSON.parse(localStorage.getItem(NE_LIST_KEY) || '[]');
      const entry = list.find(p => p.id === _projectId);
      if (entry && entry.title !== state.projectTitle) {
        entry.title = state.projectTitle;
        localStorage.setItem(NE_LIST_KEY, JSON.stringify(list));
      }
    } catch (e) {}
    showSaveIndicator();
    // Cloud sync
    if (typeof syncEditorData === 'function') syncEditorData(_projectId, state);
  } catch (e) {
    console.error('Save failed:', e);
  }
}

function loadState() {
  migrateEditorStorage();
  let list = [];
  try { list = JSON.parse(localStorage.getItem(NE_LIST_KEY) || '[]'); } catch (e) {}

  _projectId = localStorage.getItem('ne_active');
  if (!_projectId || !list.find(p => p.id === _projectId)) {
    _projectId = list.length ? list[0].id : null;
  }
  if (!_projectId) {
    // プロジェクトが1つもない → 新規作成して登録
    _projectId = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
    list.push({ id: _projectId, title: state.projectTitle });
    localStorage.setItem(NE_LIST_KEY, JSON.stringify(list));
    localStorage.setItem('ne_proj_' + _projectId, JSON.stringify(state));
  }
  localStorage.setItem('ne_active', _projectId);

  try {
    const raw = localStorage.getItem('ne_proj_' + _projectId);
    if (raw) {
      const loaded = JSON.parse(raw);
      state = { ...state, ...loaded };
    }
  } catch (e) {
    console.error('Load failed:', e);
  }
}

function scheduleAutoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(saveState, 1500);
}

function syncCurrentEpisode() {
  if (!state.activeEpisodeId) return;
  const textarea = document.getElementById('editorTextarea');
  if (textarea.style.display === 'none') return;
  const ep = findEpisode(state.activeEpisodeId);
  if (ep) ep.content = textarea.value;
}

function findEpisode(epId) {
  for (const ch of state.chapters) {
    for (const ep of ch.episodes) {
      if (ep.id === epId) return ep;
    }
  }
  return null;
}

function findChapterOfEpisode(epId) {
  for (const ch of state.chapters) {
    for (const ep of ch.episodes) {
      if (ep.id === epId) return ch;
    }
  }
  return null;
}

/* ================================================================
   SIDEBAR RENDER
================================================================ */
function renderSidebar() {
  const tree = document.getElementById('sidebarTree');
  tree.innerHTML = '';

  state.chapters.forEach((ch, chIdx) => {
    const chEl = document.createElement('div');
    chEl.className = 'chapter-item';
    chEl.dataset.chId = ch.id;

    // Chapter header
    const header = document.createElement('div');
    header.className = 'chapter-header';
    header.innerHTML = `
      <div class="chapter-toggle ${ch.collapsed ? '' : 'open'}">&#9654;</div>
      <div class="chapter-label">${escHtml(ch.title)}</div>
      <div class="chapter-actions">
        <button class="ch-action-btn" title="話を追加" onclick="event.stopPropagation(); addEpisode('${ch.id}')">+</button>
        <button class="ch-action-btn del" title="削除" onclick="event.stopPropagation(); deleteChapter('${ch.id}')">&#10005;</button>
      </div>
    `;
    header.onclick = (e) => {
      if (e.target.closest('.ch-action-btn')) return;
      ch.collapsed = !ch.collapsed;
      renderSidebar();
      scheduleAutoSave();
    };
    header.oncontextmenu = (e) => {
      showCtxMenu(e, [
        { label: '名前を変更', action: () => renameChapter(ch.id) },
        { label: '話を追加', action: () => addEpisode(ch.id) },
        'sep',
        { label: '上へ移動', action: () => moveChapter(ch.id, -1) },
        { label: '下へ移動', action: () => moveChapter(ch.id, 1) },
        'sep',
        { label: '削除', danger: true, action: () => deleteChapter(ch.id) }
      ]);
    };
    chEl.appendChild(header);

    // Episodes
    const epList = document.createElement('div');
    epList.className = 'episode-list' + (ch.collapsed ? ' collapsed' : '');
    if (!ch.collapsed) epList.style.maxHeight = (ch.episodes.length * 40 + 10) + 'px';

    ch.episodes.forEach((ep, epIdx) => {
      const epEl = document.createElement('div');
      epEl.className = 'episode-item' + (ep.id === state.activeEpisodeId ? ' active' : '');
      epEl.innerHTML = `
        <span class="episode-icon">&#9679;</span>
        <span class="episode-label">${escHtml(ep.title)}</span>
        <div class="episode-actions">
          <button class="ep-action-btn del" title="削除" onclick="event.stopPropagation(); deleteEpisode('${ch.id}', '${ep.id}')">&#10005;</button>
        </div>
      `;
      epEl.onclick = (e) => {
        if (e.target.closest('.ep-action-btn')) return;
        selectEpisode(ep.id);
      };
      epEl.oncontextmenu = (e) => {
        showCtxMenu(e, [
          { label: '名前を変更', action: () => renameEpisode(ep.id) },
          'sep',
          { label: '上へ移動', action: () => moveEpisode(ch.id, ep.id, -1) },
          { label: '下へ移動', action: () => moveEpisode(ch.id, ep.id, 1) },
          'sep',
          { label: '削除', danger: true, action: () => deleteEpisode(ch.id, ep.id) }
        ]);
      };
      epList.appendChild(epEl);
    });

    chEl.appendChild(epList);
    tree.appendChild(chEl);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================================================================
   CHAPTER / EPISODE OPERATIONS
================================================================ */
function addChapter() {
  const num = state.chapters.length + 1;
  openModal('新しい章', `<input class="modal-input" id="newChName" value="第${num}章" placeholder="章のタイトル">`, [
    { label: 'キャンセル' },
    { label: '追加', primary: true, action: () => {
      const name = document.getElementById('newChName').value.trim() || `第${num}章`;
      state.chapters.push({ id: 'ch_' + uid(), title: name, episodes: [], collapsed: false });
      renderSidebar();
      saveState();
      toast('章を追加しました');
    }}
  ]);
}

function addEpisode(chId) {
  const ch = state.chapters.find(c => c.id === chId);
  if (!ch) return;
  const num = ch.episodes.length + 1;
  openModal('新しい話', `<input class="modal-input" id="newEpName" value="第${num}話" placeholder="話のタイトル">`, [
    { label: 'キャンセル' },
    { label: '追加', primary: true, action: () => {
      const name = document.getElementById('newEpName').value.trim() || `第${num}話`;
      const epId = 'ep_' + uid();
      ch.episodes.push({ id: epId, title: name, content: '' });
      ch.collapsed = false;
      renderSidebar();
      selectEpisode(epId);
      saveState();
      toast('話を追加しました');
    }}
  ]);
}

function deleteChapter(chId) {
  const ch = state.chapters.find(c => c.id === chId);
  if (!ch) return;
  openModal('章の削除', `<p style="font-size:0.9rem;color:var(--text2);">「${escHtml(ch.title)}」とその中の全ての話を削除しますか？<br>この操作は取り消せません。</p>`, [
    { label: 'キャンセル' },
    { label: '削除', primary: true, action: () => {
      // Check if active episode is in this chapter
      const hasActive = ch.episodes.some(ep => ep.id === state.activeEpisodeId);
      state.chapters = state.chapters.filter(c => c.id !== chId);
      if (hasActive) {
        state.activeEpisodeId = null;
        showEmptyState();
      }
      renderSidebar();
      saveState();
      toast('章を削除しました', 'warn');
    }}
  ]);
}

function deleteEpisode(chId, epId) {
  const ch = state.chapters.find(c => c.id === chId);
  if (!ch) return;
  const ep = ch.episodes.find(e => e.id === epId);
  if (!ep) return;
  openModal('話の削除', `<p style="font-size:0.9rem;color:var(--text2);">「${escHtml(ep.title)}」を削除しますか？<br>この操作は取り消せません。</p>`, [
    { label: 'キャンセル' },
    { label: '削除', primary: true, action: () => {
      ch.episodes = ch.episodes.filter(e => e.id !== epId);
      if (state.activeEpisodeId === epId) {
        state.activeEpisodeId = null;
        showEmptyState();
      }
      renderSidebar();
      saveState();
      toast('話を削除しました', 'warn');
    }}
  ]);
}

function renameChapter(chId) {
  const ch = state.chapters.find(c => c.id === chId);
  if (!ch) return;
  openModal('章の名前を変更', `<input class="modal-input" id="renChName" value="${escHtml(ch.title)}">`, [
    { label: 'キャンセル' },
    { label: '変更', primary: true, action: () => {
      const name = document.getElementById('renChName').value.trim();
      if (name) { ch.title = name; renderSidebar(); saveState(); }
    }}
  ]);
}

function renameEpisode(epId) {
  const ep = findEpisode(epId);
  if (!ep) return;
  openModal('話の名前を変更', `<input class="modal-input" id="renEpName" value="${escHtml(ep.title)}">`, [
    { label: 'キャンセル' },
    { label: '変更', primary: true, action: () => {
      const name = document.getElementById('renEpName').value.trim();
      if (name) {
        ep.title = name;
        renderSidebar();
        if (state.activeEpisodeId === epId) {
          document.getElementById('editorEpTitle').textContent = name;
        }
        saveState();
      }
    }}
  ]);
}

function moveChapter(chId, dir) {
  const idx = state.chapters.findIndex(c => c.id === chId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= state.chapters.length) return;
  [state.chapters[idx], state.chapters[newIdx]] = [state.chapters[newIdx], state.chapters[idx]];
  renderSidebar();
  saveState();
}

function moveEpisode(chId, epId, dir) {
  const ch = state.chapters.find(c => c.id === chId);
  if (!ch) return;
  const idx = ch.episodes.findIndex(e => e.id === epId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= ch.episodes.length) return;
  [ch.episodes[idx], ch.episodes[newIdx]] = [ch.episodes[newIdx], ch.episodes[idx]];
  renderSidebar();
  saveState();
}

function renameProject() {
  openModal('プロジェクト名を変更', `<input class="modal-input" id="renProjName" value="${escHtml(state.projectTitle)}">`, [
    { label: 'キャンセル' },
    { label: '変更', primary: true, action: () => {
      const name = document.getElementById('renProjName').value.trim();
      if (name) {
        state.projectTitle = name;
        document.getElementById('projectName').textContent = name;
        document.title = name + ' - 小説エディタ';
        saveState();
      }
    }}
  ]);
}

/* ================================================================
   EDITOR
================================================================ */
function selectEpisode(epId) {
  syncCurrentEpisode();
  const ep = findEpisode(epId);
  if (!ep) return;
  const ch = findChapterOfEpisode(epId);

  state.activeEpisodeId = epId;

  // Show editor
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorToolbar').style.display = 'flex';
  document.getElementById('statusBar').style.display = 'flex';
  const textarea = document.getElementById('editorTextarea');
  textarea.style.display = 'block';
  textarea.value = ep.content || '';
  document.getElementById('editorEpTitle').textContent = ep.title;
  if (ch) document.getElementById('statusChapter').textContent = ch.title + ' / ' + ep.title;

  updateStatusBar();
  renderSidebar();
  // Close sidebar on mobile after selecting episode
  if (window.innerWidth <= 768) closeMobileSidebar();
  // スクロールを先頭に戻す（描画完了後に実行）
  requestAnimationFrame(() => {
    textarea.setSelectionRange(0, 0);
    textarea.scrollTop = 0;
    textarea.focus();
  });
  scheduleAutoSave();
}

function showEmptyState() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('editorToolbar').style.display = 'none';
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('editorTextarea').style.display = 'none';
}

function updateStatusBar() {
  const textarea = document.getElementById('editorTextarea');
  const text = textarea.value;
  const chars = text.length;
  const charsNoSpace = text.replace(/[\s\u3000]/g, '').length;
  const lines = text ? text.split('\n').length : 0;
  document.getElementById('statusChars').textContent = `${charsNoSpace} 文字（空白込み ${chars}）`;
  document.getElementById('statusLines').textContent = `${lines} 行`;
}

// Textarea events
document.getElementById('editorTextarea').addEventListener('input', () => {
  updateStatusBar();
  scheduleAutoSave();
});

// Enter key in modal
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) {
    const primaryBtn = document.querySelector('#modalBtns .modal-btn.primary');
    if (primaryBtn) primaryBtn.click();
  }
  if (e.key === 'Escape') {
    closeModal();
    closeCtxMenu();
  }
});

/* ================================================================
   CLEANUP (空白整形)
================================================================ */
function cleanupText() {
  const textarea = document.getElementById('editorTextarea');
  const original = textarea.value;
  if (!original.trim()) { toast('テキストがありません', 'warn'); return; }

  // Preview changes
  const cleaned = performCleanup(original);
  const stats = getCleanupStats(original, cleaned);

  openModal('空白整形プレビュー', `
    <div class="cleanup-preview">
      <div>半角スペース削除: <span class="cleanup-stat">${stats.halfSpaces}</span> 箇所</div>
      <div>全角スペース削除: <span class="cleanup-stat">${stats.fullSpaces}</span> 箇所</div>
      <div>余分な空行削除: <span class="cleanup-stat">${stats.blankLines}</span> 箇所</div>
      <div>行頭・行末の空白: <span class="cleanup-stat">${stats.trimmed}</span> 箇所</div>
      <div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">
        文字数: ${original.length} → <span class="cleanup-stat">${cleaned.length}</span>
        （<span class="cleanup-stat">${original.length - cleaned.length}</span> 文字削減）
      </div>
    </div>
  `, [
    { label: 'キャンセル' },
    { label: '整形を適用', primary: true, action: () => {
      textarea.value = cleaned;
      updateStatusBar();
      scheduleAutoSave();
      toast('空白を整形しました');
    }}
  ]);
}

function performCleanup(text) {
  // 1. Replace full-width spaces with nothing (except intentional indentation)
  text = text.replace(/\u3000/g, '');
  // 2. Replace multiple half-width spaces with single (within lines)
  text = text.replace(/[ \t]{2,}/g, ' ');
  // 3. Trim each line
  text = text.split('\n').map(line => line.trim()).join('\n');
  // 4. Collapse 3+ consecutive blank lines into 1 blank line
  text = text.replace(/\n{3,}/g, '\n\n');
  // 5. Remove leading/trailing whitespace
  text = text.trim();
  return text;
}

function getCleanupStats(original, cleaned) {
  const halfSpaces = (original.match(/[ \t]{2,}/g) || []).length;
  const fullSpaces = (original.match(/\u3000/g) || []).length;
  const origLines = original.split('\n');
  const cleanLines = cleaned.split('\n');
  const blankLines = origLines.filter((l, i, arr) => l.trim() === '' && i > 0 && arr[i-1].trim() === '' && (i < 2 || arr[i-2].trim() === '')).length;
  const trimmed = origLines.filter(l => l !== l.trim()).length;
  return { halfSpaces, fullSpaces, blankLines, trimmed };
}

/* ================================================================
   NOVEL FORMAT (小説整形)
   一般的な日本語小説のルールに基づく一括整形
================================================================ */
function novelFormat() {
  const textarea = document.getElementById('editorTextarea');
  const original = textarea.value;
  if (!original.trim()) { toast('テキストがありません', 'warn'); return; }

  const formatted = performNovelFormat(original);
  const diff = getNovelFormatStats(original, formatted);

  openModal('小説整形プレビュー', `
    <div class="cleanup-preview">
      <div style="margin-bottom:10px;font-size:0.8rem;color:var(--text2);line-height:1.6;">
        一般的な小説のルールに基づいて整形します
      </div>
      <div>「。」後の改行追加: <span class="cleanup-stat">${diff.periodBreaks}</span> 箇所</div>
      <div>字下げ追加（行頭に全角スペース）: <span class="cleanup-stat">${diff.indented}</span> 箇所</div>
      <div>！？後の全角スペース挿入: <span class="cleanup-stat">${diff.exclamationSpaces}</span> 箇所</div>
      <div>三点リーダー統一（… → ……）: <span class="cleanup-stat">${diff.ellipsis}</span> 箇所</div>
      <div>ダッシュ統一（― → ――）: <span class="cleanup-stat">${diff.dashes}</span> 箇所</div>
      ${diff.alreadyIndented > 0 ? `<div style="color:var(--text2);font-size:0.78rem;margin-top:4px;">※ 既にインデント済み: ${diff.alreadyIndented} 行（スキップ）</div>` : ''}
      ${diff.dialogueLines > 0 ? `<div style="color:var(--text2);font-size:0.78rem;">※ 会話文（「『）: ${diff.dialogueLines} 行（スキップ）</div>` : ''}
    </div>
  `, [
    { label: 'キャンセル' },
    { label: '整形を適用', primary: true, action: () => {
      textarea.value = formatted;
      updateStatusBar();
      scheduleAutoSave();
      toast('小説整形を適用しました');
    }}
  ]);
}

function performNovelFormat(text) {
  // --- Rule 0: 「。」の後に改行を挿入（文末で次の文へ）---
  // 括弧 「」『』（）【】〈〉《》 の内側では改行しない
  text = insertPeriodBreaks(text);

  let lines = text.split('\n');

  lines = lines.map(line => {
    // Skip empty lines
    if (line.trim() === '') return line;

    // --- Rule 1: 字下げ（段落インデント）---
    // 会話文（「『）で始まる行はインデントしない
    // 既に全角スペースで始まる行もスキップ
    const trimmed = line.trim();
    const isDialogue = /^[「『（]/.test(trimmed);
    const isAlreadyIndented = /^\u3000/.test(trimmed);

    if (!isDialogue && !isAlreadyIndented && trimmed.length > 0) {
      line = '\u3000' + trimmed;
    } else {
      line = trimmed;
    }

    return line;
  });

  let result = lines.join('\n');

  // --- Rule 2: ！？の後に文が続く場合、全角スペースを挿入 ---
  // ！？!?⁉⁈‼❓❗ 等の直後に閉じ括弧や改行以外の文字が来る場合にスペース挿入
  // \uFE0F (異体字セレクタ/絵文字表示) も考慮
  result = result.replace(/([！？!?⁉⁈‼⁇❓❗]\uFE0F?)(?![！？!?⁉⁈‼⁇❓❗\uFE0F\s\n」』）\u3000])/g, '$1\u3000');

  // --- Rule 3: 三点リーダーを偶数個（2個セット）に統一 ---
  // 半角...を全角……に変換
  result = result.replace(/\.{3,}/g, '……');
  // 奇数個の…を偶数個に（1個→2個、3個→2個）
  result = result.replace(/…{1,}/g, (match) => {
    const count = match.length;
    // 偶数個ならそのまま、奇数個なら1つ足して偶数に
    const evenCount = count % 2 === 0 ? count : count + 1;
    return '…'.repeat(evenCount);
  });

  // --- Rule 4: ダッシュを偶数個（2個セット）に統一 ---
  // 半角ダッシュを全角に
  result = result.replace(/\-{2,}/g, '――');
  // 奇数個の―を偶数個に
  result = result.replace(/―{1,}/g, (match) => {
    const count = match.length;
    const evenCount = count % 2 === 0 ? count : count + 1;
    return '―'.repeat(evenCount);
  });

  return result;
}

function insertPeriodBreaks(text) {
  const openers = '「『（【〈《';
  const closers = '」』）】〉》';
  let depth = 0;
  let result = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    result += ch;
    if (openers.indexOf(ch) >= 0) {
      depth++;
    } else if (closers.indexOf(ch) >= 0) {
      depth = Math.max(0, depth - 1);
    } else if (ch === '。' && depth === 0) {
      const next = text[i + 1];
      // Skip if next char is: newline, another period, closing bracket, or end of text
      if (next && next !== '\n' && next !== '。' && closers.indexOf(next) < 0) {
        result += '\n';
      }
    }
  }
  return result;
}

function countPeriodBreaks(text) {
  const openers = '「『（【〈《';
  const closers = '」』）】〉》';
  let depth = 0;
  let count = 0;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (openers.indexOf(ch) >= 0) {
      depth++;
    } else if (closers.indexOf(ch) >= 0) {
      depth = Math.max(0, depth - 1);
    } else if (ch === '。' && depth === 0) {
      const next = text[i + 1];
      if (next && next !== '\n' && next !== '。' && closers.indexOf(next) < 0) {
        count++;
      }
    }
  }
  return count;
}

function getNovelFormatStats(original, formatted) {
  const origLines = original.split('\n');
  const fmtLines = formatted.split('\n');
  let indented = 0;
  let alreadyIndented = 0;
  let dialogueLines = 0;

  origLines.forEach(line => {
    const trimmed = line.trim();
    if (trimmed === '') return;
    const isDialogue = /^[「『（]/.test(trimmed);
    const isAlreadyIndented = /^\u3000/.test(trimmed);
    if (isDialogue) {
      dialogueLines++;
    } else if (isAlreadyIndented) {
      alreadyIndented++;
    } else {
      indented++;
    }
  });

  // Count ！？ spaces added
  const origExcl = (original.match(/([！？!?⁉⁈‼⁇❓❗]\uFE0F?)(?![！？!?⁉⁈‼⁇❓❗\uFE0F\s\n」』）\u3000])/g) || []).length;
  const exclamationSpaces = origExcl;

  // Count ellipsis fixes
  const origEllipsis = (original.match(/\.{3,}/g) || []).length;
  const origOddEllipsis = (original.match(/…/g) || []).filter((_, i, arr) => {
    // Rough count of odd ellipsis groups
    return true;
  }).length;
  // Simpler: count groups of … that are odd-length
  const ellipsisGroups = original.match(/…+/g) || [];
  const oddEllipsis = ellipsisGroups.filter(g => g.length % 2 !== 0).length;
  const dotEllipsis = (original.match(/\.{3,}/g) || []).length;
  const ellipsis = oddEllipsis + dotEllipsis;

  // Count dash fixes
  const dashGroups = original.match(/―+/g) || [];
  const oddDashes = dashGroups.filter(g => g.length % 2 !== 0).length;
  const hyphenDashes = (original.match(/\-{2,}/g) || []).length;
  const dashes = oddDashes + hyphenDashes;

  // Count periods that will trigger a line break (respects bracket depth)
  const periodBreaks = countPeriodBreaks(original);

  return { indented, alreadyIndented, dialogueLines, exclamationSpaces, ellipsis, dashes, periodBreaks };
}

================================================================ */
let _ttsPlaying = false;
let _ttsPaused = false;
let _ttsRate = parseFloat(localStorage.getItem('tts_rate') || '1.0') || 1.0;
let _ttsSentences = [];  // { text, el }
let _ttsIndex = 0;
let _ttsToken = 0;       // 世代トークン: cancel後に届く古いonend/onerrorを無視する
let _keepAliveAudio = null;
let _wakeLock = null;

function toggleTTS() {
  if (_ttsPlaying) {
    stopTTS();
    return;
  }
  showTTSModal();
}

function showTTSModal() {
  const textarea = document.getElementById('editorTextarea');
  const selected = textarea.selectionStart !== textarea.selectionEnd
    ? textarea.value.substring(textarea.selectionStart, textarea.selectionEnd)
    : '';
  const fullText = textarea.value;

  if (!fullText.trim()) {
    toast('読み上げるテキストがありません', 'warn');
    return;
  }

  const ep = findEpisode(state.activeEpisodeId);
  const epTitle = ep ? ep.title : '';
  const targetText = selected || fullText;
  const charCount = targetText.replace(/[\s\u3000]/g, '').length;

  let html = '<div style="font-size:0.88rem;line-height:1.8;">';
  html += '<div style="margin-bottom:10px;color:var(--text2);">';
  html += selected ? '選択範囲を読み上げます' : '全文を読み上げます';
  html += ' (' + charCount.toLocaleString() + '文字)</div>';

  // Speed control
  html += '<div style="margin-bottom:14px;">';
  html += '<label style="display:block;margin-bottom:6px;font-weight:600;">速度</label>';
  html += '<div style="display:flex;align-items:center;gap:10px;">';
  html += '<span style="font-size:0.75rem;color:var(--text2);">遅い</span>';
  html += '<input type="range" id="ttsSpeed" min="0.5" max="4.0" step="0.1" value="' + _ttsRate + '" ';
  html += 'style="flex:1;accent-color:var(--accent);" oninput="document.getElementById(\'ttsSpeedVal\').textContent=this.value+\'x\'">';
  html += '<span style="font-size:0.75rem;color:var(--text2);">速い</span>';
  html += '<span id="ttsSpeedVal" style="min-width:32px;text-align:center;font-weight:600;">' + _ttsRate + 'x</span>';
  html += '</div></div>';

  // Wake Lock option (スリープ防止)
  const wakeLockPref = localStorage.getItem('tts_wakelock') !== '0';
  html += '<label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;font-size:0.85rem;">';
  html += '<input type="checkbox" id="ttsWakeLockChk"' + (wakeLockPref ? ' checked' : '') + ' style="accent-color:var(--accent);width:16px;height:16px;">';
  html += '画面を消さない（スリープ防止）';
  html += '</label>';

  html += '<div style="font-size:0.75rem;color:var(--text2);line-height:1.6;">';
  html += '再生中は読み上げビューが開き、今読んでいる文がハイライトされます。';
  html += 'Androidでは画面を消してもバックグラウンド再生を試みます（機種により動作が異なる場合があります）。';
  html += '</div>';
  html += '</div>';

  // Store target text for playback
  window._ttsTargetText = targetText;
  window._ttsTargetTitle = epTitle;

  openModal('🔊 読み上げ' + (epTitle ? ' - ' + epTitle : ''), html, [
    { label: 'キャンセル' },
    { label: '▶ 再生', primary: true, action: () => startTTS() }
  ]);
}

function startTTS() {
  if (!window._ttsTargetText) return;

  const speedInput = document.getElementById('ttsSpeed');
  if (speedInput) _ttsRate = parseFloat(speedInput.value) || 1.0;
  localStorage.setItem('tts_rate', String(_ttsRate));

  const wlChk = document.getElementById('ttsWakeLockChk');
  const useWakeLock = wlChk ? wlChk.checked : (localStorage.getItem('tts_wakelock') !== '0');
  localStorage.setItem('tts_wakelock', useWakeLock ? '1' : '0');

  buildTTSView(window._ttsTargetText, window._ttsTargetTitle);
  if (!_ttsSentences.length) {
    toast('読み上げるテキストがありません', 'warn');
    return;
  }

  // 読み上げビューの速度セレクトを現在値に合わせる（最も近い選択肢にスナップ）
  const sel = document.getElementById('ttsViewSpeed');
  if (sel) {
    let best = sel.options[0].value, bestDiff = Infinity;
    for (const opt of sel.options) {
      const d = Math.abs(parseFloat(opt.value) - _ttsRate);
      if (d < bestDiff) { bestDiff = d; best = opt.value; }
    }
    sel.value = best;
    _ttsRate = parseFloat(best);
  }

  startKeepAlive();
  setupMediaSession(window._ttsTargetTitle);
  if (useWakeLock) acquireWakeLock();

  speakFrom(0);
}

/* --- 文単位分割（括弧内の句点では区切らない） --- */
function splitSentencesInParagraph(para) {
  const OPEN = '「『（【〈《〔';
  const CLOSE = '」』）】〉》〕';
  const ENDS = '。！？!?';
  const TRAIL = '。！？!?…‥」』）】〉》〕';
  const out = [];
  let cur = '';
  let depth = 0;

  for (let i = 0; i < para.length; i++) {
    const ch = para[i];
    cur += ch;
    if (OPEN.includes(ch)) depth++;
    else if (CLOSE.includes(ch)) depth = Math.max(0, depth - 1);
    if (depth === 0 && ENDS.includes(ch)) {
      const next = para[i + 1];
      if (next && TRAIL.includes(next)) continue; // 「？」の連続や閉じ括弧はまとめる
      out.push(cur);
      cur = '';
    }
  }
  if (cur) out.push(cur);

  // 長すぎる文は読点で分割（スマホで長文が途切れる対策）
  const result = [];
  for (const s of out) {
    let rest = s;
    while (rest.length > 120) {
      let cut = rest.lastIndexOf('、', 120);
      if (cut < 40) cut = 119;
      result.push(rest.slice(0, cut + 1));
      rest = rest.slice(cut + 1);
    }
    if (rest) result.push(rest);
  }
  return result.filter(s => s.trim());
}

/* --- 読み上げビュー構築 --- */
function buildTTSView(text, title) {
  const body = document.getElementById('ttsViewBody');
  body.innerHTML = '';
  _ttsSentences = [];
  _ttsIndex = 0;

  text.split(/\n/).forEach(para => {
    if (!para.trim()) return;
    const p = document.createElement('p');
    splitSentencesInParagraph(para).forEach(s => {
      const span = document.createElement('span');
      span.className = 'tts-sentence';
      span.textContent = s;
      const idx = _ttsSentences.length;
      span.onclick = () => speakFrom(idx); // 文をタップでそこから再生
      _ttsSentences.push({ text: s, el: span });
      p.appendChild(span);
    });
    if (p.childNodes.length) body.appendChild(p);
  });

  document.getElementById('ttsViewTitle').textContent = title || '読み上げ';
  document.getElementById('ttsView').classList.add('open');
}

/* --- 再生エンジン: 1文ずつ読む --- */
function speakFrom(i) {
  if (!_ttsSentences.length) return;
  if (i < 0) i = 0;
  if (i >= _ttsSentences.length) {
    onTTSEnd();
    toast('読み上げが終わりました');
    return;
  }

  const myToken = ++_ttsToken;
  _ttsIndex = i;
  _ttsPlaying = true;
  _ttsPaused = false;
  updateTTSHighlight();
  updateTTSButtons();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';

  const u = new SpeechSynthesisUtterance(_ttsSentences[i].text);
  u.lang = 'ja-JP';
  u.rate = _ttsRate;
  const voices = speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang && v.lang.startsWith('ja'));
  if (jaVoice) u.voice = jaVoice;

  u.onend = () => {
    if (myToken !== _ttsToken || !_ttsPlaying || _ttsPaused) return;
    speakFrom(i + 1);
  };
  u.onerror = (e) => {
    if (myToken !== _ttsToken) return;
    if (e.error === 'canceled' || e.error === 'interrupted') return;
    console.warn('TTS error:', e);
    if (_ttsPlaying && !_ttsPaused) speakFrom(i + 1); // 読めない文はスキップして続行
  };

  // Androidではcancel直後のspeakが無視されることがあるため少し待つ
  const doSpeak = () => { if (myToken === _ttsToken) speechSynthesis.speak(u); };
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(doSpeak, 60);
  } else {
    doSpeak();
  }
}

function updateTTSHighlight() {
  document.querySelectorAll('.tts-sentence.current').forEach(el => el.classList.remove('current'));
  const s = _ttsSentences[_ttsIndex];
  if (!s) return;
  s.el.classList.add('current');
  try { s.el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {}
  const prog = document.getElementById('ttsProgress');
  if (prog) prog.textContent = (_ttsIndex + 1) + ' / ' + _ttsSentences.length + ' 文';
}

function ttsPrevSentence() { if (_ttsSentences.length) speakFrom(Math.max(0, _ttsIndex - 1)); }
function ttsNextSentence() { if (_ttsSentences.length) speakFrom(_ttsIndex + 1); }

function ttsChangeSpeed(v) {
  _ttsRate = parseFloat(v) || 1.0;
  localStorage.setItem('tts_rate', String(_ttsRate));
  if (_ttsPlaying && !_ttsPaused) speakFrom(_ttsIndex); // 現在の文から新しい速度で読み直す
}

function pauseResumeTTS() {
  if (!_ttsPlaying) return;
  if (_ttsPaused) {
    // 再開: Androidではpause/resumeが不安定なので、現在の文の頭から読み直す
    if (_keepAliveAudio) _keepAliveAudio.play().catch(() => {});
    speakFrom(_ttsIndex);
  } else {
    _ttsPaused = true;
    _ttsToken++;
    speechSynthesis.cancel();
    if (_keepAliveAudio) _keepAliveAudio.pause();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    updateTTSButtons();
  }
}

function stopTTS() {
  _ttsToken++;
  speechSynthesis.cancel();
  onTTSEnd();
}

function onTTSEnd() {
  _ttsPlaying = false;
  _ttsPaused = false;
  stopKeepAlive();
  releaseWakeLock();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'none';
    try { navigator.mediaSession.metadata = null; } catch (e) {}
  }
  document.getElementById('ttsView').classList.remove('open');
  updateTTSButtons();
}

function updateTTSButtons() {
  const ttsBtn = document.getElementById('ttsBtn');
  if (ttsBtn) ttsBtn.innerHTML = _ttsPlaying ? '&#9632; 停止' : '&#128266; 読み上げ';
  const pauseBtn = document.getElementById('ttsViewPauseBtn');
  if (pauseBtn) pauseBtn.innerHTML = _ttsPaused ? '&#9654;' : '&#10074;&#10074;';
}

/* --- バックグラウンド再生対策 (Android) ---
   ほぼ無音のループ音源を鳴らし続けることで、タブを「音声再生中」として
   維持し、画面オフ時もタブが凍結されにくくする。Media Sessionにより
   ロック画面・通知からの操作にも対応する。 */
function makeKeepAliveWav() {
  // 25Hz・極小音量のサイン波1秒（スピーカーではほぼ聞こえない）
  const rate = 8000, n = rate;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  writeStr(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 25 * i / rate) * 300), true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

function startKeepAlive() {
  try {
    if (!_keepAliveAudio) {
      _keepAliveAudio = new Audio(URL.createObjectURL(makeKeepAliveWav()));
      _keepAliveAudio.loop = true;
    }
    _keepAliveAudio.play().catch(() => {});
  } catch (e) {}
}

function stopKeepAlive() {
  if (_keepAliveAudio) {
    _keepAliveAudio.pause();
    _keepAliveAudio.currentTime = 0;
  }
}

function setupMediaSession(title) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '読み上げ',
      artist: '小説管理',
      album: state.projectTitle || ''
    });
    navigator.mediaSession.setActionHandler('play', () => { if (_ttsPaused) pauseResumeTTS(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (_ttsPlaying && !_ttsPaused) pauseResumeTTS(); });
    navigator.mediaSession.setActionHandler('stop', () => stopTTS());
    navigator.mediaSession.setActionHandler('nexttrack', () => ttsNextSentence());
    navigator.mediaSession.setActionHandler('previoustrack', () => ttsPrevSentence());
  } catch (e) {}
}

/* --- Wake Lock（画面スリープ防止・オプション） --- */
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      _wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* 省電力モード等で失敗することがある */ }
}

function releaseWakeLock() {
  if (_wakeLock) {
    try { _wakeLock.release(); } catch (e) {}
    _wakeLock = null;
  }
}

// 画面復帰時にWake Lockを取り直す（Wake Lockはタブが隠れると自動解放されるため）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && _ttsPlaying && localStorage.getItem('tts_wakelock') !== '0') {
    acquireWakeLock();
  }
});

// デスクトップChromeの「長い発話が途中で止まる」既知バグ対策（Androidには適用しない）
if (typeof speechSynthesis !== 'undefined' && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
  setInterval(() => {
    if (_ttsPlaying && !_ttsPaused && speechSynthesis.speaking) {
      speechSynthesis.pause();
      speechSynthesis.resume();
    }
  }, 10000);
}

// Preload voices
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

   STATS
================================================================ */
function showStats() {
  let totalChars = 0;
  let totalLines = 0;
  let totalEps = 0;
  const chapterStats = [];

  state.chapters.forEach(ch => {
    let chChars = 0;
    ch.episodes.forEach(ep => {
      const text = ep.id === state.activeEpisodeId
        ? document.getElementById('editorTextarea').value
        : (ep.content || '');
      const c = text.replace(/[\s\u3000]/g, '').length;
      chChars += c;
      totalLines += text ? text.split('\n').length : 0;
      totalEps++;
    });
    totalChars += chChars;
    chapterStats.push({ title: ch.title, chars: chChars, eps: ch.episodes.length });
  });

  let html = `<div style="font-size:0.88rem;line-height:1.8;">`;
  html += `<div style="margin-bottom:12px;">
    <div>合計文字数: <strong style="color:var(--accent)">${totalChars.toLocaleString()}</strong> 文字</div>
    <div>合計行数: <strong>${totalLines.toLocaleString()}</strong> 行</div>
    <div>章数: <strong>${state.chapters.length}</strong> / 話数: <strong>${totalEps}</strong></div>
  </div>`;

  if (chapterStats.length > 0) {
    html += `<div style="border-top:1px solid var(--border);padding-top:10px;">`;
    chapterStats.forEach(cs => {
      html += `<div style="display:flex;justify-content:space-between;padding:3px 0;">
        <span>${escHtml(cs.title)}（${cs.eps}話）</span>
        <span style="color:var(--accent2)">${cs.chars.toLocaleString()} 文字</span>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  openModal('文字数統計', html, [{ label: '閉じる' }]);
}

/* ================================================================
   EXPORT / IMPORT
================================================================ */
function exportProject() {
  syncCurrentEpisode();
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.projectTitle || 'novel') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('エクスポートしました');
}

function importProject() {
  const fileInput = document.getElementById('fileInput');
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.chapters) throw new Error('Invalid format');
        openModal('インポート確認', `<p style="font-size:0.9rem;color:var(--text2);">「${escHtml(data.projectTitle || '不明')}」をインポートしますか？<br>現在のデータは上書きされます。</p>`, [
          { label: 'キャンセル' },
          { label: 'インポート', primary: true, action: () => {
            state = { ...state, ...data };
            state.activeEpisodeId = null;
            document.getElementById('projectName').textContent = state.projectTitle;
            document.title = state.projectTitle + ' - 小説エディタ';
            showEmptyState();
            renderSidebar();
            saveState();
            toast('インポートしました');
          }}
        ]);
      } catch (err) {
        toast('ファイルの形式が正しくありません', 'error');
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  };
  fileInput.click();
}

/* ================================================================
   KEYBOARD SHORTCUTS
================================================================ */
document.addEventListener('keydown', e => {
  // Ctrl+S: Save
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveState();
    toast('保存しました');
  }
});

/* ================================================================
   INIT
================================================================ */
/* ================================================================
   SHARE TARGET (他アプリからの「共有」受け取り)
   manifest.json の share_target により、Androidの共有メニューから
   novel-editor.html?share_text=... の形でテキストが渡ってくる。
================================================================ */
function checkSharedText() {
  const params = new URLSearchParams(location.search);
  const text = params.get('share_text') || '';
  const title = params.get('share_title') || '';
  const url = params.get('share_url') || '';
  if (!text && !title && !url) return;

  // 再読み込みで二重取込しないようURLからパラメータを消す
  history.replaceState(null, '', location.pathname);

  const shared = [text, url].filter(Boolean).join('\n').trim();
  if (!shared) return;
  showShareImportModal(shared, title.trim());
}

function showShareImportModal(text, title) {
  const count = text.replace(/[\s　]/g, '').length;
  const preview = text.slice(0, 200);

  let html = '<div style="font-size:0.88rem;line-height:1.7;">';
  if (title) {
    html += '<div style="margin-bottom:6px;font-weight:600;">' + escHtml(title) + '</div>';
  }
  html += '<div style="margin-bottom:8px;color:var(--text2);">共有されたテキスト（' + count.toLocaleString() + '文字）</div>';
  html += '<div class="cleanup-preview" style="max-height:180px;overflow-y:auto;white-space:pre-wrap;">';
  html += escHtml(preview) + (text.length > 200 ? '…' : '');
  html += '</div>';
  html += '<div style="margin-top:10px;font-size:0.8rem;color:var(--text2);">どこに追加するか選んでください。</div>';
  html += '</div>';

  const buttons = [{ label: 'キャンセル' }];
  buttons.push({ label: '新しい話にする', action: () => importSharedAsNewEpisode(text, title) });
  const activeEp = state.activeEpisodeId ? findEpisode(state.activeEpisodeId) : null;
  if (activeEp) {
    buttons.push({ label: '開いている話に追記', primary: true, action: () => appendSharedToActiveEpisode(text) });
  }

  openModal('📥 テキストを受け取りました', html, buttons);
}

function importSharedAsNewEpisode(text, title) {
  let ch = state.chapters[state.chapters.length - 1];
  if (!ch) {
    ch = { id: 'ch_' + uid(), title: '第1章', episodes: [], collapsed: false };
    state.chapters.push(ch);
  }
  const epId = 'ep_' + uid();
  const epTitle = title || ('共有テキスト ' + new Date().toLocaleDateString('ja-JP'));
  ch.episodes.push({ id: epId, title: epTitle, content: text });
  ch.collapsed = false;
  renderSidebar();
  selectEpisode(epId);
  saveState();
  toast('「' + epTitle + '」として追加しました');
}

function appendSharedToActiveEpisode(text) {
  const ep = findEpisode(state.activeEpisodeId);
  if (!ep) { importSharedAsNewEpisode(text, ''); return; }
  const textarea = document.getElementById('editorTextarea');
  syncCurrentEpisode();
  ep.content = ep.content ? (ep.content.replace(/\n+$/, '') + '\n\n' + text) : text;
  textarea.value = ep.content;
  textarea.scrollTop = textarea.scrollHeight; // 追記した末尾を見せる
  updateStatusBar();
  saveState();
  toast('「' + ep.title + '」の末尾に追加しました');
}

function init() {
  loadState();
  document.getElementById('projectName').textContent = state.projectTitle;
  document.title = state.projectTitle + ' - 小説エディタ';

  if (state.writingMode === 'vertical') {
    document.getElementById('editorTextarea').classList.add('vertical');
    document.getElementById('writingModeBtn').textContent = '横書き';
  }

  renderSidebar();

  // Restore active episode
  if (state.activeEpisodeId) {
    const ep = findEpisode(state.activeEpisodeId);
    if (ep) {
      selectEpisode(state.activeEpisodeId);
    } else {
      state.activeEpisodeId = null;
      showEmptyState();
    }
  }

  // 他アプリからの「共有」で開かれた場合の受け取り
  checkSharedText();
}

init();
</script>
